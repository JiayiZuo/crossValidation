services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cross-validation:prod
    container_name: cross-validation-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      LOG_LEVEL: info
      CROSS_VALIDATION_HTTP_ADDR: ":8080"
      CROSS_VALIDATION_TIME_WINDOW: "10s"
      CROSS_VALIDATION_ALERT_WINDOW: "60s"
      CROSS_VALIDATION_DUPLICATE_WINDOW: "3s"
      CROSS_VALIDATION_MIN_SCORE: "0.35"
      CROSS_VALIDATION_WARNING_THRESHOLD: "0.60"
      CROSS_VALIDATION_CRITICAL_THRESHOLD: "0.80"
      CROSS_VALIDATION_USE_REDIS: "true"
      CROSS_VALIDATION_REDIS_ADDR: "redis:6379"
      CROSS_VALIDATION_REDIS_DB: "0"
      CROSS_VALIDATION_USE_POSTGRES: "true"
      CROSS_VALIDATION_POSTGRES_URL: "postgres://postgres:postgres@postgres:5432/cross_validation?sslmode=disable"
    depends_on:
      - redis
      - postgres
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: cross-validation-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]

  postgres:
    image: postgres:16-alpine
    container_name: cross-validation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cross_validation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql:ro

volumes:
  postgres_data:
