apiVersion: apps/v1
kind: Deployment
metadata:
  name: cross-validation
  labels:
    app: cross-validation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cross-validation
  template:
    metadata:
      labels:
        app: cross-validation
    spec:
      containers:
        - name: cross-validation
          image: cross-validation:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: production
            - name: CROSS_VALIDATION_HTTP_ADDR
              value: ":8080"
            - name: CROSS_VALIDATION_USE_REDIS
              value: "true"
            - name: CROSS_VALIDATION_REDIS_ADDR
              value: "redis:6379"
            - name: CROSS_VALIDATION_USE_POSTGRES
              value: "true"
            - name: CROSS_VALIDATION_POSTGRES_URL
              value: "postgres://postgres:postgres@postgres:5432/cross_validation?sslmode=disable"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cross-validation
  labels:
    app: cross-validation
spec:
  type: ClusterIP
  selector:
    app: cross-validation
  ports:
    - name: http
      port: 80
      targetPort: 8080
